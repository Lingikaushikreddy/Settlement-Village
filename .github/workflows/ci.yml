name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      SETTLEMENT_LIVE_AI: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run evaluate -- --verify docs/evaluation-results.json
      - run: npm run eval:agent -- --verify public/examples/agent-report.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke test the production server
        if: matrix.node == 24
        run: |
          npm start > next-start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5173/ && break
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:5173 || { cat next-start.log; exit 1; }
      - name: Cache Playwright browsers
        if: matrix.node == 24
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        if: matrix.node == 24
        run: npm run test:e2e
        env:
          SETTLEMENT_E2E_URL: http://127.0.0.1:5173
      - name: Upload Playwright report
        if: matrix.node == 24 && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
