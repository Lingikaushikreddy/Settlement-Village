name: Production smoke test

# Vercel reports each deployment to GitHub. When a production deployment
# succeeds, check the live site actually serves a playable game.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Check live production site
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/smoke-hosted.mjs "$SITE_URL"
        env:
          # Vercel's per-deployment URL requires SSO; players use this public alias.
          SITE_URL: https://settlement-village.vercel.app
