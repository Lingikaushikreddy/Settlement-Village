name: Feature proposal
description: Suggest a focused improvement to gameplay or agent research.
title: "[Idea]: "
body:
  - type: textarea
    id: experience
    attributes:
      label: What should the player or researcher be able to do?
      description: Describe the problem and a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how this would work and any tradeoffs or alternatives.
    validations:
      required: true
